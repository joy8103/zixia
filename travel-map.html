<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行地图 · 我的足迹</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f8f9fa;
    --bg-card: #ffffff;
    --border: #e5e5e5;
    --border-light: #f0f0f0;
    --text: #1a1a1a;
    --text-secondary: #666;
    --text-dim: #999;
    --accent: #7c3aed;
    --accent-light: #ede9fe;
    --accent-hover: #c4b5fd;
    --visited: #7c3aed;
    --visited-fill: #ede9fe;
    --unvisited: #ffffff;
    --sans: 'Inter', -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-light);
    padding: 0 24px; height: 56px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; color: var(--text); text-decoration: none; }
  .nav-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px rgba(124,58,237,0.4); }
  .nav-stats { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); }
  .nav-stats .stat { display: flex; align-items: center; gap: 4px; }
  .nav-stats .num { font-weight: 600; color: var(--accent); }

  .container {
    max-width: 1200px; margin: 0 auto; padding: 24px;
    display: grid; grid-template-columns: 1fr 320px; gap: 24px;
  }
  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

  .map-card {
    background: var(--bg-card); border: 1px solid var(--border-light);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
  }
  .map-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .map-header h2 { font-size: 16px; font-weight: 600; }
  .map-legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); }
  .legend-dot.visited { background: var(--visited-fill); border-color: var(--accent); }
  .legend-dot.unvisited { background: var(--unvisited); }

  .map-wrapper {
    position: relative; width: 100%; aspect-ratio: 5 / 4;
    background: #fafafa; border-radius: 8px; overflow: hidden;
  }
  #map-svg { width: 100%; height: 100%; display: block; }

  .city-region {
    fill: var(--unvisited);
    stroke: #d4d4d8;
    stroke-width: 0.5;
    transition: fill 0.2s, stroke 0.2s, stroke-width 0.2s;
    cursor: pointer;
  }
  .city-region:hover {
    fill: var(--accent-hover);
    stroke: var(--accent);
    stroke-width: 1;
  }
  .city-region.visited {
    fill: var(--visited-fill);
    stroke: var(--accent);
    stroke-width: 0.8;
  }
  .city-region.visited:hover {
    fill: #ddd6fe;
    stroke-width: 1.2;
  }

  .city-label {
    font-size: 7px;
    fill: var(--text-secondary);
    text-anchor: middle;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .city-region:hover + .city-label,
  .city-region.visited + .city-label {
    opacity: 1;
  }
  .city-region.visited + .city-label {
    fill: var(--accent);
    font-weight: 600;
  }

  .tooltip {
    position: absolute; background: var(--text); color: white;
    padding: 6px 12px; border-radius: 6px; font-size: 12px;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    z-index: 10; white-space: nowrap;
  }
  .tooltip.visible { opacity: 1; }

  .sidebar { display: flex; flex-direction: column; gap: 16px; }
  .sidebar-card {
    background: var(--bg-card); border: 1px solid var(--border-light);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
  }
  .sidebar-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }

  .visited-list {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 400px; overflow-y: auto;
  }
  .visited-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-radius: 8px;
    background: var(--accent-light); font-size: 13px;
    cursor: pointer; transition: background 0.2s;
  }
  .visited-item:hover { background: #ddd6fe; }
  .visited-item .city-name { font-weight: 500; color: var(--accent); }
  .visited-item .visit-date { font-size: 11px; color: var(--text-dim); }
  .empty-state { text-align: center; padding: 24px 12px; color: var(--text-dim); font-size: 13px; }

  .progress-bar { height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s; }
  .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-chip {
    padding: 4px 10px; border-radius: 12px; font-size: 12px;
    border: 1px solid var(--border); background: white; cursor: pointer;
    color: var(--text-secondary); transition: all 0.2s;
  }
  .filter-chip:hover { border-color: var(--accent); }
  .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow-lg);
    width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  }
  .modal-header {
    padding: 20px 24px; border-bottom: 1px solid var(--border-light);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 { font-size: 18px; font-weight: 600; }
  .modal-subtitle { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .modal-close {
    background: none; border: none; cursor: pointer; font-size: 22px;
    color: var(--text-dim); width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; transition: background 0.2s;
  }
  .modal-close:hover { background: #f5f5f5; }
  .modal-body { padding: 24px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  .form-group input, .form-group textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: var(--sans);
    color: var(--text); background: white; transition: border 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 70px; }

  .photo-urls { display: flex; flex-direction: column; gap: 8px; }
  .photo-url-row { display: flex; gap: 8px; }
  .photo-url-row input { flex: 1; }
  .photo-url-row .remove-photo { background: #f5f5f5; border: none; cursor: pointer; width: 36px; border-radius: 8px; font-size: 16px; color: var(--text-dim); }
  .photo-url-row .remove-photo:hover { background: #fee2e2; color: #ef4444; }
  .add-photo-btn { background: none; border: 1px dashed var(--border); padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary); width: 100%; }
  .add-photo-btn:hover { border-color: var(--accent); color: var(--accent); }
  .photo-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .photo-preview img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }

  .modal-footer {
    padding: 16px 24px; border-top: 1px solid var(--border-light);
    display: flex; justify-content: space-between; align-items: center;
  }
  .btn { padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; font-family: var(--sans); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #6d28d9; }
  .btn-secondary { background: white; border-color: var(--border); color: var(--text-secondary); }
  .btn-secondary:hover { background: #f5f5f5; }
  .btn-danger { background: white; border-color: #fecaca; color: #ef4444; }
  .btn-danger:hover { background: #fef2f2; }

  .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); font-size: 14px; }
  .loading .spinner { width: 24px; height: 24px; border: 2px solid var(--border-light); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text); color: white; padding: 10px 20px;
    border-radius: 8px; font-size: 13px; box-shadow: var(--shadow-lg);
    z-index: 300; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><span class="dot"></span>旅行地图</a>
  <div class="nav-stats">
    <div class="stat">已去 <span class="num" id="stat-visited">0</span> 城</div>
    <div class="stat">共 <span class="num" id="stat-total">0</span> 城</div>
  </div>
</nav>

<div class="container">
  <div class="map-card">
    <div class="map-header">
      <h2>中国旅行足迹</h2>
      <div class="map-legend">
        <div class="legend-item"><span class="legend-dot visited"></span>已到访</div>
        <div class="legend-item"><span class="legend-dot unvisited"></span>未到访</div>
      </div>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div class="map-wrapper" id="map-wrapper">
      <div class="loading"><div class="spinner"></div>加载地图中...</div>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="sidebar">
    <div class="sidebar-card">
      <h3>旅行进度</h3>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-text">
        <span id="progress-label">0 / 0</span>
        <span id="progress-percent">0%</span>
      </div>
    </div>

    <div class="sidebar-card">
      <h3>已到访城市</h3>
      <div class="visited-list" id="visited-list">
        <div class="empty-state">还没有记录到访的城市<br>点击地图上的城市开始记录</div>
      </div>
    </div>

    <div class="sidebar-card">
      <h3>数据管理</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-secondary" id="btn-export" style="font-size:12px;padding:6px 14px;">导出</button>
        <button class="btn btn-secondary" id="btn-import" style="font-size:12px;padding:6px 14px;">导入</button>
        <button class="btn btn-primary" id="btn-share" style="font-size:12px;padding:6px 14px;">分享</button>
        <button class="btn btn-danger" id="btn-clear" style="font-size:12px;padding:6px 14px;">清空</button>
      </div>
      <input type="file" id="import-file" accept=".json" style="display:none;">
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modal-city-name">编辑城市</h2>
        <div class="modal-subtitle" id="modal-city-province"></div>
      </div>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>到访时间</label>
        <input type="text" id="visit-date" placeholder="如：2024年8月 / 2023年暑假 / 多次到访">
      </div>
      <div class="form-group">
        <label>城市特色 / 感受</label>
        <textarea id="visit-notes" placeholder="记录这座城市给你的印象..."></textarea>
      </div>
      <div class="form-group">
        <label>照片链接</label>
        <div class="photo-urls" id="photo-urls"></div>
        <button class="add-photo-btn" id="add-photo">+ 添加照片链接</button>
        <div class="photo-preview" id="photo-preview"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-remove">删除记录</button>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" id="btn-cancel">取消</button>
        <button class="btn btn-primary" id="btn-save">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'travel-map-data';

function loadData() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {}; }
  catch(e) { return {}; }
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

let travelData = loadData();
let currentCity = null;
let allFeatures = [];
let activeProvince = 'all';

const LNG_MIN = 73, LNG_MAX = 136;
const LAT_MIN = 17, LAT_MAX = 54;
const SVG_W = 1000, SVG_H = 760;

function project(lng, lat) {
  const x = ((lng - LNG_MIN) / (LNG_MAX - LNG_MIN)) * SVG_W;
  const y = ((LAT_MAX - lat) / (LAT_MAX - LAT_MIN)) * SVG_H;
  return { x, y };
}

const mapWrapper = document.getElementById('map-wrapper');
const tooltip = document.getElementById('tooltip');

async function loadMap() {
  try {
    const res = await fetch('china-cities-final.json');
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    const geojson = await res.json();
    allFeatures = geojson.features;
    renderMap();
    renderFilters();
  } catch(e) {
    console.error('Map load failed:', e);
    mapWrapper.innerHTML = '<div class="loading">地图加载失败，请刷新重试</div>';
  }
}

function renderMap() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = 'map-svg';
  svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  const features = activeProvince === 'all'
    ? allFeatures
    : allFeatures.filter(f => f.properties.province === activeProvince);

  features.forEach(feature => {
    const name = feature.properties.name;
    const province = feature.properties.province;
    const geomType = feature.geometry.type;
    const coords = feature.geometry.coordinates;
    const paths = geomType === 'MultiPolygon' ? coords : [coords];

    // 计算投影后的边界面积，判断是否为微型区域
    let bounds = null;
    const allPoints = [];
    paths.forEach(polygon => polygon.forEach(ring =>
      ring.forEach(([lng, lat]) => allPoints.push(project(lng, lat)))
    ));
    if (allPoints.length > 0) {
      const xs = allPoints.map(p => p.x), ys = allPoints.map(p => p.y);
      const w = Math.max(...xs) - Math.min(...xs);
      const h = Math.max(...ys) - Math.min(...ys);
      bounds = { w, h, area: w * h };
    }
    const isMicro = bounds && bounds.area < 100; // 投影面积<100平方像素

    paths.forEach(polygon => {
      polygon.forEach(ring => {
        const points = ring.map(([lng, lat]) => project(lng, lat));
        const pathD = points.map((p, i) =>
          (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)
        ).join(' ') + 'Z';

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathD);
        path.setAttribute('class', 'city-region');
        path.setAttribute('data-city', name);
        path.setAttribute('data-province', province);

        if (travelData[name]) path.classList.add('visited');

        path.addEventListener('mouseenter', (e) => {
          const info = travelData[name];
          showTooltip(info ? `${name} · ${info.date || '已到访'}` : name, e);
        });
        path.addEventListener('mouseleave', () => hideTooltip());
        path.addEventListener('mousemove', (e) => moveTooltip(e));
        path.addEventListener('click', () => openModal(name, province));

        svg.appendChild(path);
      });
    });

    // Add city name label at center (skip micro regions to avoid clutter)
    if (feature.properties.center && !isMicro) {
      const [lng, lat] = feature.properties.center;
      const pos = project(lng, lat);
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('class', 'city-label');
      label.setAttribute('x', pos.x.toFixed(1));
      label.setAttribute('y', (pos.y + 2).toFixed(1));
      label.textContent = name.replace(/(市|自治州|地区|盟|特别行政区)$/, '');
      svg.appendChild(label);
    }
  });

  mapWrapper.innerHTML = '';
  mapWrapper.appendChild(svg);
  updateStats();
}

function renderFilters() {
  const provinces = [...new Set(allFeatures.map(f => f.properties.province))].sort();
  const bar = document.getElementById('filter-bar');
  
  const allChip = document.createElement('span');
  allChip.className = 'filter-chip active';
  allChip.textContent = '全部';
  allChip.onclick = () => { activeProvince = 'all'; renderFilters(); renderMap(); };
  bar.innerHTML = '';
  bar.appendChild(allChip);

  provinces.forEach(p => {
    const chip = document.createElement('span');
    chip.className = 'filter-chip' + (activeProvince === p ? ' active' : '');
    chip.textContent = p;
    chip.onclick = () => { activeProvince = p; renderFilters(); renderMap(); };
    bar.appendChild(chip);
  });

  // Mark active
  bar.querySelectorAll('.filter-chip').forEach(c => {
    if ((c.textContent === '全部' && activeProvince === 'all') || c.textContent === activeProvince) {
      c.classList.add('active');
    } else {
      c.classList.remove('active');
    }
  });
}

function showTooltip(text, e) {
  tooltip.textContent = text;
  moveTooltip(e);
  tooltip.classList.add('visible');
}
function moveTooltip(e) {
  const rect = mapWrapper.getBoundingClientRect();
  let x = e.clientX - rect.left + 12;
  let y = e.clientY - rect.top + 12;
  if (x + tooltip.offsetWidth > rect.width) x = e.clientX - rect.left - tooltip.offsetWidth - 8;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

// Modal
const modalOverlay = document.getElementById('modal-overlay');
const modalCityName = document.getElementById('modal-city-name');
const modalCityProvince = document.getElementById('modal-city-province');
const visitDate = document.getElementById('visit-date');
const visitNotes = document.getElementById('visit-notes');
const photoUrls = document.getElementById('photo-urls');
const photoPreview = document.getElementById('photo-preview');

function openModal(name, province) {
  currentCity = { name, province };
  modalCityName.textContent = name;
  modalCityProvince.textContent = province;
  const data = travelData[name] || {};
  visitDate.value = data.date || '';
  visitNotes.value = data.notes || '';
  photoUrls.innerHTML = '';
  photoPreview.innerHTML = '';
  (data.photos || []).forEach(url => addPhotoRow(url));
  
  if (isReadOnly) {
    // 只读模式：禁用编辑，隐藏保存/删除按钮
    visitDate.readOnly = true;
    visitNotes.readOnly = true;
    document.getElementById('btn-save').style.display = 'none';
    document.getElementById('btn-remove').style.display = 'none';
    document.getElementById('add-photo').style.display = 'none';
    photoUrls.querySelectorAll('input').forEach(i => i.readOnly = true);
    photoUrls.querySelectorAll('.remove-photo').forEach(b => b.style.display = 'none');
    // 如果没有记录，不弹窗
    if (!data.date && !data.notes && !(data.photos || []).length) return;
  } else {
    visitDate.readOnly = false;
    visitNotes.readOnly = false;
    document.getElementById('btn-save').style.display = 'block';
    document.getElementById('btn-remove').style.display = data.date ? 'block' : 'none';
    document.getElementById('add-photo').style.display = 'block';
  }
  modalOverlay.classList.add('visible');
}
function closeModal() { modalOverlay.classList.remove('visible'); currentCity = null; }

function addPhotoRow(url = '') {
  const row = document.createElement('div');
  row.className = 'photo-url-row';
  const input = document.createElement('input');
  input.type = 'text'; input.value = url; input.placeholder = '粘贴照片链接...';
  input.addEventListener('input', updatePhotoPreview);
  const btn = document.createElement('button');
  btn.className = 'remove-photo'; btn.textContent = '\u00d7';
  btn.onclick = () => { row.remove(); updatePhotoPreview(); };
  row.appendChild(input); row.appendChild(btn);
  photoUrls.appendChild(row);
  if (url) updatePhotoPreview();
}
function updatePhotoPreview() {
  const urls = Array.from(photoUrls.querySelectorAll('input')).map(i => i.value.trim()).filter(u => u);
  photoPreview.innerHTML = '';
  urls.forEach(url => {
    const img = document.createElement('img');
    img.src = url; img.onerror = () => { img.style.display = 'none'; };
    photoPreview.appendChild(img);
  });
}

document.getElementById('add-photo').onclick = () => addPhotoRow();
document.getElementById('btn-save').onclick = () => {
  if (!currentCity) return;
  const date = visitDate.value.trim();
  const notes = visitNotes.value.trim();
  const photos = Array.from(photoUrls.querySelectorAll('input')).map(i => i.value.trim()).filter(u => u);
  if (!date && !notes && photos.length === 0) {
    delete travelData[currentCity.name];
  } else {
    travelData[currentCity.name] = { date, notes, photos };
  }
  saveData(travelData);
  closeModal(); refreshMap(); showToast('已保存');
};
document.getElementById('btn-remove').onclick = () => {
  if (!currentCity) return;
  delete travelData[currentCity.name];
  saveData(travelData); closeModal(); refreshMap(); showToast('已删除');
};
document.getElementById('btn-cancel').onclick = closeModal;
document.getElementById('modal-close').onclick = closeModal;
modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };

function refreshMap() {
  document.querySelectorAll('.city-region').forEach(el => {
    const name = el.getAttribute('data-city');
    if (travelData[name]) el.classList.add('visited');
    else el.classList.remove('visited');
  });
  updateStats();
}

function updateStats() {
  const visited = Object.keys(travelData).filter(k => travelData[k].date).length;
  const total = allFeatures.length;
  document.getElementById('stat-visited').textContent = visited;
  document.getElementById('stat-total').textContent = total;
  const pct = total > 0 ? Math.round(visited / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${visited} / ${total}`;
  document.getElementById('progress-percent').textContent = pct + '%';

  const list = document.getElementById('visited-list');
  const visitedCities = Object.keys(travelData).filter(k => travelData[k].date);
  if (visitedCities.length === 0) {
    list.innerHTML = '<div class="empty-state">还没有记录到访的城市<br>点击地图上的城市开始记录</div>';
  } else {
    list.innerHTML = visitedCities
      .sort((a, b) => (travelData[b].date || '').localeCompare(travelData[a].date || ''))
      .map(name => {
        const feat = allFeatures.find(f => f.properties.name === name);
        const prov = feat ? feat.properties.province : '';
        return `<div class="visited-item" data-city="${name}">
          <span class="city-name">${name}</span>
          <span class="visit-date">${travelData[name].date || ''}</span>
        </div>`;
      }).join('');
    list.querySelectorAll('.visited-item').forEach(el => {
      el.onclick = () => {
        const name = el.getAttribute('data-city');
        const feat = allFeatures.find(f => f.properties.name === name);
        openModal(name, feat ? feat.properties.province : '');
      };
    });
  }
}

const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toast.textContent = msg; toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 2000);
}

document.getElementById('btn-export').onclick = () => {
  const blob = new Blob([JSON.stringify(travelData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `travel-data-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url); showToast('已导出');
};
document.getElementById('btn-import').onclick = () => document.getElementById('import-file').click();
document.getElementById('import-file').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      travelData = { ...travelData, ...data };
      saveData(travelData); refreshMap(); showToast('已导入');
    } catch(err) { showToast('导入失败：文件格式错误'); }
  };
  reader.readAsText(file); e.target.value = '';
};
document.getElementById('btn-clear').onclick = () => {
  if (confirm('确定清空所有旅行记录吗？此操作不可撤销。')) {
    travelData = {}; saveData(travelData); refreshMap(); showToast('已清空');
  }
};

// === 分享功能 ===
document.getElementById('btn-share').onclick = () => {
  const visited = Object.keys(travelData).filter(k => travelData[k].date);
  if (visited.length === 0) {
    showToast('还没有到访记录，先添加城市吧');
    return;
  }
  // 压缩数据：只取已访问城市的关键信息
  const shareData = {};
  visited.forEach(k => {
    shareData[k] = {
      d: travelData[k].date || '',
      n: travelData[k].notes || '',
      p: travelData[k].photos || []
    };
  });
  const json = JSON.stringify(shareData);
  // 用 LZ-String 压缩 + URI安全编码
  const encoded = LZString.compressToEncodedURIComponent(json);
  const shareUrl = location.origin + location.pathname + '#s=' + encoded;
  
  // 复制到剪贴板
  if (navigator.clipboard) {
    navigator.clipboard.writeText(shareUrl).then(() => {
      showToast('分享链接已复制到剪贴板');
    }).catch(() => {
      prompt('复制这个链接分享给朋友：', shareUrl);
    });
  } else {
    prompt('复制这个链接分享给朋友：', shareUrl);
  }
};

// === 只读分享模式 ===
function checkShareMode() {
  const hash = location.hash;
  if (hash.startsWith('#s=')) {
    try {
      const encoded = hash.substring(3);
      const json = LZString.decompressFromEncodedURIComponent(encoded);
      if (!json) { console.error('Decompress failed'); return false; }
      const sharedData = JSON.parse(json);
      // 转换回完整格式
      const readOnlyData = {};
      Object.keys(sharedData).forEach(k => {
        readOnlyData[k] = {
          date: sharedData[k].d || '',
          notes: sharedData[k].n || '',
          photos: sharedData[k].p || []
        };
      });
      travelData = readOnlyData;
      isReadOnly = true;
      // 隐藏编辑相关 UI
      document.getElementById('btn-export').style.display = 'none';
      document.getElementById('btn-import').style.display = 'none';
      document.getElementById('btn-share').style.display = 'none';
      document.getElementById('btn-clear').style.display = 'none';
      // 修改标题
      document.querySelector('.map-header h2').textContent = '中国旅行足迹（分享）';
      document.querySelector('.nav-brand').innerHTML = '<span class="dot"></span>旅行地图 · 分享';
      return true;
    } catch(e) {
      console.error('Share data parse error:', e);
      return false;
    }
  }
  return false;
}

let isReadOnly = false;

loadMap();
checkShareMode();
</script>
