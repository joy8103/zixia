<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷 🎮</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #e0e0e0;
    user-select: none;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #e94560, #f5a623, #50fa7b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    letter-spacing: 4px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #7f8c9b;
    margin-bottom: 18px;
  }

  /* 控制栏 */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .difficulty-btn {
    padding: 8px 20px;
    border: 2px solid #3a3f55;
    border-radius: 20px;
    background: transparent;
    color: #a0aab5;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.25s;
  }
  .difficulty-btn:hover { border-color: #e94560; color: #e94560; }
  .difficulty-btn.active {
    background: #e94560;
    border-color: #e94560;
    color: #fff;
    box-shadow: 0 0 16px rgba(233,69,96,0.4);
  }

  /* 状态栏 */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 560px;
    margin-bottom: 14px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 10px 20px;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .stat .icon { font-size: 1.3rem; }
  .mine-count { color: #e94560; }
  .timer { color: #50fa7b; }

  .face-btn {
    font-size: 1.8rem;
    cursor: pointer;
    background: none;
    border: none;
    transition: transform 0.15s;
    line-height: 1;
  }
  .face-btn:hover { transform: scale(1.2); }

  /* 游戏板 */
  .board-container {
    background: rgba(255,255,255,0.03);
    border-radius: 14px;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .board {
    display: grid;
    gap: 2px;
  }

  .cell {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.1s;
    position: relative;
  }

  /* 未揭开 */
  .cell.hidden {
    background: linear-gradient(145deg, #4a5580, #3a4570);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.3);
  }
  .cell.hidden:hover {
    background: linear-gradient(145deg, #5a6590, #4a5580);
    border-color: rgba(255,255,255,0.2);
  }
  .cell.hidden:active {
    transform: scale(0.92);
    box-shadow: none;
  }

  /* 已揭开 */
  .cell.revealed {
    background: rgba(10, 12, 20, 0.7);
    border: 1px solid rgba(255,255,255,0.02);
    cursor: default;
  }

  /* 旗帜 */
  .cell.flagged::after {
    content: '🚩';
    font-size: 0.9rem;
  }

  /* 问号 */
  .cell.question::after {
    content: '❓';
    font-size: 0.75rem;
  }

  /* 数字颜色 */
  .cell.n1 { color: #4fc3f7; }
  .cell.n2 { color: #81c784; }
  .cell.n3 { color: #e57373; }
  .cell.n4 { color: #7986cb; }
  .cell.n5 { color: #ff8a65; }
  .cell.n6 { color: #4dd0e1; }
  .cell.n7 { color: #ba68c8; }
  .cell.n8 { color: #90a4ae; }

  /* 雷 */
  .cell.mine-hit {
    background: rgba(233,69,96,0.5) !important;
    animation: boom 0.3s ease-out;
  }
  .cell.mine-show {
    background: rgba(233,69,96,0.15);
  }

  @keyframes boom {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* 遮罩 */
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .overlay-box {
    background: linear-gradient(145deg, #1e2540, #162035);
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .overlay-box h2 {
    font-size: 2rem;
    margin-bottom: 10px;
  }
  .overlay-box p {
    color: #7f8c9b;
    margin-bottom: 24px;
    font-size: 1rem;
  }
  .overlay-box button {
    padding: 12px 36px;
    border-radius: 25px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-win {
    background: linear-gradient(135deg, #50fa7b, #00c853);
    color: #1a1a2e;
  }
  .btn-lose {
    background: linear-gradient(135deg, #e94560, #ff6b6b);
    color: #fff;
  }
  .overlay-box button:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

  /* 操作提示 */
  .leaderboard-btn {
    padding: 6px 20px;
    border: 1px solid rgba(168, 85, 247, 0.3);
    border-radius: 16px;
    background: rgba(168, 85, 247, 0.08);
    color: #a855f7;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .leaderboard-btn:hover {
    background: rgba(168, 85, 247, 0.2);
    border-color: rgba(168, 85, 247, 0.5);
  }

  /* 排行榜 */
  .lb-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 150;
    background: rgba(10, 5, 20, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.25s;
  }
  .lb-overlay.show { display: flex; }

  .lb-box {
    background: linear-gradient(145deg, #1e1240, #160a30);
    border: 1px solid rgba(168, 85, 247, 0.2);
    border-radius: 18px;
    padding: 24px;
    width: 90%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
  }

  .lb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .lb-header h2 {
    font-size: 1.3rem;
    background: linear-gradient(90deg, #f5a623, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .lb-close {
    background: none;
    border: none;
    color: #7f8c9b;
    font-size: 1.3rem;
    cursor: pointer;
  }
  .lb-close:hover { color: #fff; }

  .lb-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .lb-tab {
    flex: 1;
    padding: 8px 0;
    border: 1px solid rgba(168, 85, 247, 0.2);
    border-radius: 10px;
    background: transparent;
    color: #7f8c9b;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lb-tab.active {
    background: rgba(168, 85, 247, 0.15);
    border-color: rgba(168, 85, 247, 0.4);
    color: #a855f7;
  }
  .lb-tab:hover { border-color: rgba(168, 85, 247, 0.4); }

  .lb-list { margin-bottom: 12px; }

  .lb-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: rgba(168, 85, 247, 0.05);
    border: 1px solid rgba(168, 85, 247, 0.08);
    transition: background 0.2s;
  }
  .lb-item:hover { background: rgba(168, 85, 247, 0.1); }

  .lb-rank {
    width: 28px;
    font-size: 1rem;
    text-align: center;
    flex-shrink: 0;
  }
  .lb-rank.gold { color: #f5a623; }
  .lb-rank.silver { color: #b0bec5; }
  .lb-rank.bronze { color: #cd7f32; }

  .lb-info {
    flex: 1;
    margin-left: 10px;
  }
  .lb-time {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
  }
  .lb-date {
    font-size: 0.72rem;
    color: #5a6577;
    margin-top: 2px;
  }

  .lb-medal {
    font-size: 1.1rem;
    margin-left: 8px;
  }

  .lb-empty {
    text-align: center;
    padding: 30px 0;
    color: #5a6577;
    font-size: 0.9rem;
  }

  .lb-clear {
    display: block;
    margin: 8px auto 0;
    padding: 6px 18px;
    border: 1px solid rgba(233, 69, 96, 0.2);
    border-radius: 12px;
    background: transparent;
    color: #e94560;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lb-clear:hover {
    background: rgba(233, 69, 96, 0.1);
    border-color: rgba(233, 69, 96, 0.4);
  }

  .tips {
    margin-top: 12px;
    font-size: 0.78rem;
    color: #5a6577;
    text-align: center;
    line-height: 1.6;
  }

  /* 响应式 */
  @media (max-width: 600px) {
    .cell { width: 26px; height: 26px; font-size: 0.75rem; }
    .board-container { padding: 8px; }
    .board { gap: 1px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<h1>💣 扫 雷</h1>
<div class="subtitle">经典扫雷 · 右键标旗 · 首击必安</div>

<div class="controls">
  <button class="difficulty-btn active" data-level="easy">初级 9×9</button>
  <button class="difficulty-btn" data-level="medium">中级 16×16</button>
  <button class="difficulty-btn" data-level="hard">高级 30×16</button>
</div>

<div class="status-bar">
  <div class="stat mine-count">
    <span class="icon">💣</span>
    <span id="mineLeft">10</span>
  </div>
  <button class="face-btn" id="faceBtn" title="重新开始">😊</button>
  <div class="stat timer">
    <span class="icon">⏱️</span>
    <span id="timer">000</span>
  </div>
</div>

<div class="board-container">
  <div class="board" id="board"></div>
</div>

<div class="controls" style="margin-top:4px">
  <button class="leaderboard-btn" id="lbBtn" onclick="toggleLeaderboard()">🏆 排行榜</button>
</div>

<div class="tips">
  左键揭开 · 右键标旗/问号 · 点击表情重新开始<br>
  首次点击保证安全 💪
</div>

<!-- 排行榜 -->
<div class="lb-overlay" id="lbOverlay">
  <div class="lb-box">
    <div class="lb-header">
      <h2>🏆 排行榜</h2>
      <button class="lb-close" onclick="toggleLeaderboard()">✕</button>
    </div>
    <div class="lb-tabs">
      <button class="lb-tab active" data-lb="easy" onclick="switchLbTab('easy')">初级</button>
      <button class="lb-tab" data-lb="medium" onclick="switchLbTab('medium')">中级</button>
      <button class="lb-tab" data-lb="hard" onclick="switchLbTab('hard')">高级</button>
    </div>
    <div class="lb-list" id="lbList"></div>
    <button class="lb-clear" onclick="clearLb()">🗑️ 清空记录</button>
  </div>
</div>

<div class="overlay" id="overlay" style="display:none">
  <div class="overlay-box">
    <h2 id="overlayTitle"></h2>
    <p id="overlayMsg"></p>
    <button id="overlayBtn"></button>
  </div>
</div>

<script>
const LEVELS = {
  easy:   { rows: 9,  cols: 9,  mines: 10 },
  medium: { rows: 16, cols: 16, mines: 40 },
  hard:   { rows: 16, cols: 30, mines: 99 },
};

let level = 'easy';
let rows, cols, totalMines;
let board = [];       // -1=mine, 0-8=number
let revealed = [];
let flagged = [];     // 0=none, 1=flag, 2=question
let gameStarted = false;
let gameOver = false;
let firstClick = true;
let timerInterval = null;
let seconds = 0;
let minesLeft = 0;

const boardEl = document.getElementById('board');
const mineLeftEl = document.getElementById('mineLeft');
const timerEl = document.getElementById('timer');
const faceBtn = document.getElementById('faceBtn');
const overlay = document.getElementById('overlay');

// 难度切换
document.querySelectorAll('.difficulty-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.difficulty-btn.active').classList.remove('active');
    btn.classList.add('active');
    level = btn.dataset.level;
    initGame();
  });
});

faceBtn.addEventListener('click', initGame);

function initGame() {
  const cfg = LEVELS[level];
  rows = cfg.rows;
  cols = cfg.cols;
  totalMines = cfg.mines;
  minesLeft = totalMines;

  board = Array.from({ length: rows }, () => Array(cols).fill(0));
  revealed = Array.from({ length: rows }, () => Array(cols).fill(false));
  flagged = Array.from({ length: rows }, () => Array(cols).fill(0));

  gameStarted = false;
  gameOver = false;
  firstClick = true;
  seconds = 0;

  clearInterval(timerInterval);
  timerInterval = null;
  timerEl.textContent = '000';
  mineLeftEl.textContent = String(minesLeft).padStart(3, '0');
  faceBtn.textContent = '😊';
  overlay.style.display = 'none';

  renderBoard();
}

function renderBoard() {
  boardEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
  boardEl.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell hidden';
      cell.dataset.r = r;
      cell.dataset.c = c;

      cell.addEventListener('mousedown', e => {
        if (gameOver) return;
        if (e.button === 0) faceBtn.textContent = '😮';
      });
      cell.addEventListener('mouseup', e => {
        if (!gameOver) faceBtn.textContent = '😊';
      });
      cell.addEventListener('click', e => onLeftClick(r, c));
      cell.addEventListener('contextmenu', e => {
        e.preventDefault();
        onRightClick(r, c);
      });

      boardEl.appendChild(cell);
    }
  }

  // 响应式调整
  if (window.innerWidth < 600) {
    boardEl.style.gridTemplateColumns = `repeat(${cols}, 26px)`;
    boardEl.querySelectorAll('.cell').forEach(c => {
      c.style.width = '26px';
      c.style.height = '26px';
    });
  }
}

function placeMines(safeR, safeC) {
  let placed = 0;
  while (placed < totalMines) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    // 首击3x3安全区
    if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
    if (board[r][c] === -1) continue;
    board[r][c] = -1;
    placed++;
  }
  // 计算数字
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === -1) continue;
      let count = 0;
      forNeighbors(r, c, (nr, nc) => {
        if (board[nr][nc] === -1) count++;
      });
      board[r][c] = count;
    }
  }
}

function forNeighbors(r, c, fn) {
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) fn(nr, nc);
    }
  }
}

function onLeftClick(r, c) {
  if (gameOver || flagged[r][c] === 1) return;

  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    startTimer();
  }

  if (revealed[r][c]) {
    // chord（双击快速揭开）
    chordReveal(r, c);
    return;
  }

  reveal(r, c);
}

function onRightClick(r, c) {
  if (gameOver || revealed[r][c]) return;

  const cell = getCell(r, c);
  
  if (flagged[r][c] === 0) {
    flagged[r][c] = 1;
    cell.classList.add('flagged');
    minesLeft--;
  } else if (flagged[r][c] === 1) {
    flagged[r][c] = 2;
    cell.classList.remove('flagged');
    cell.classList.add('question');
    minesLeft++;
  } else {
    flagged[r][c] = 0;
    cell.classList.remove('question');
  }

  mineLeftEl.textContent = String(Math.max(0, minesLeft)).padStart(3, '0');
}

function reveal(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  if (revealed[r][c] || flagged[r][c] === 1) return;

  revealed[r][c] = true;
  const cell = getCell(r, c);
  cell.classList.remove('hidden');
  cell.classList.add('revealed');

  if (board[r][c] === -1) {
    // 踩雷
    cell.classList.add('mine-hit');
    cell.textContent = '💥';
    gameLose(r, c);
    return;
  }

  if (board[r][c] > 0) {
    cell.textContent = board[r][c];
    cell.classList.add('n' + board[r][c]);
  }

  // 空白扩散
  if (board[r][c] === 0) {
    forNeighbors(r, c, (nr, nc) => reveal(nr, nc));
  }

  checkWin();
}

function chordReveal(r, c) {
  if (!revealed[r][c] || board[r][c] <= 0) return;
  
  let flagCount = 0;
  forNeighbors(r, c, (nr, nc) => {
    if (flagged[nr][nc] === 1) flagCount++;
  });

  if (flagCount === board[r][c]) {
    forNeighbors(r, c, (nr, nc) => {
      if (!revealed[nr][nc] && flagged[nr][nc] !== 1) {
        reveal(nr, nc);
      }
    });
  }
}

function getCell(r, c) {
  return boardEl.children[r * cols + c];
}

function startTimer() {
  if (timerInterval) return;
  gameStarted = true;
  timerInterval = setInterval(() => {
    seconds++;
    if (seconds > 999) seconds = 999;
    timerEl.textContent = String(seconds).padStart(3, '0');
  }, 1000);
}

function gameLose(hitR, hitC) {
  gameOver = true;
  clearInterval(timerInterval);
  faceBtn.textContent = '😵';

  // 显示所有雷
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = getCell(r, c);
      if (board[r][c] === -1 && !(r === hitR && c === hitC)) {
        if (flagged[r][c] !== 1) {
          cell.classList.remove('hidden');
          cell.classList.add('revealed', 'mine-show');
          cell.textContent = '💣';
        }
      } else if (board[r][c] !== -1 && flagged[r][c] === 1) {
        // 错误标旗
        cell.classList.remove('flagged');
        cell.textContent = '❌';
        cell.classList.add('revealed');
      }
    }
  }

  setTimeout(() => {
    showOverlay('lose');
  }, 600);
}

function checkWin() {
  let unrevealed = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!revealed[r][c]) unrevealed++;
    }
  }
  if (unrevealed === totalMines) {
    gameOver = true;
    clearInterval(timerInterval);
    faceBtn.textContent = '😎';

    // 自动标旗
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!revealed[r][c] && flagged[r][c] !== 1) {
          flagged[r][c] = 1;
          getCell(r, c).classList.add('flagged');
        }
      }
    }
    mineLeftEl.textContent = '000';

    setTimeout(() => showOverlay('win'), 400);
  }
}

function showOverlay(type) {
  const title = document.getElementById('overlayTitle');
  const msg = document.getElementById('overlayMsg');
  const btn = document.getElementById('overlayBtn');

  if (type === 'win') {
    // 记录排行榜
    const rank = addRecord(level, seconds);
    const rankText = rank <= 3 ? ` 🏆 第${rank}名！` : ` 排名第${rank}`;
    title.textContent = '🎉 恭喜通关！';
    msg.textContent = `用时 ${seconds} 秒完成 ${rows}×${cols} 扫雷${rankText}`;
    btn.className = 'btn-win';
  } else {
    title.textContent = '💥 踩雷了！';
    msg.textContent = `坚持了 ${seconds} 秒，再来一局？`;
    btn.className = 'btn-lose';
  }
  btn.textContent = '再来一局';

  overlay.style.display = 'flex';
  btn.onclick = () => {
    overlay.style.display = 'none';
    initGame();
  };
}

// 长按标旗（移动端支持）
let longPressTimer = null;
boardEl.addEventListener('touchstart', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  longPressTimer = setTimeout(() => {
    onRightClick(r, c);
    longPressTimer = 'fired';
  }, 400);
}, { passive: true });

boardEl.addEventListener('touchend', e => {
  if (longPressTimer === 'fired') {
    e.preventDefault();
    longPressTimer = null;
    return;
  }
  clearTimeout(longPressTimer);
  longPressTimer = null;
});

boardEl.addEventListener('touchmove', () => {
  clearTimeout(longPressTimer);
  longPressTimer = null;
});

// ====== 排行榜 ======
const LB_KEY = 'minesweeper_leaderboard';
let currentLbTab = 'easy';

function getLeaderboard() {
  try {
    return JSON.parse(localStorage.getItem(LB_KEY)) || { easy: [], medium: [], hard: [] };
  } catch { return { easy: [], medium: [], hard: [] }; }
}

function saveLeaderboard(lb) {
  localStorage.setItem(LB_KEY, JSON.stringify(lb));
}

function addRecord(lvl, time) {
  const lb = getLeaderboard();
  const record = {
    time: time,
    date: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
  };
  lb[lvl].push(record);
  lb[lvl].sort((a, b) => a.time - b.time);
  lb[lvl] = lb[lvl].slice(0, 20); // 保留前20名
  saveLeaderboard(lb);
  return lb[lvl].indexOf(record) + 1; // 返回排名
}

function toggleLeaderboard() {
  const el = document.getElementById('lbOverlay');
  el.classList.toggle('show');
  if (el.classList.contains('show')) {
    switchLbTab(level);
  }
}

function switchLbTab(tab) {
  currentLbTab = tab;
  document.querySelectorAll('.lb-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.lb === tab);
  });
  renderLbList();
}

function renderLbList() {
  const lb = getLeaderboard();
  const records = lb[currentLbTab] || [];
  const listEl = document.getElementById('lbList');

  if (records.length === 0) {
    listEl.innerHTML = '<div class="lb-empty">暂无记录<br>通关后自动上榜 🎮</div>';
    return;
  }

  const medals = ['🥇', '🥈', '🥉'];
  const rankClasses = ['gold', 'silver', 'bronze'];

  listEl.innerHTML = records.map((r, i) => `
    <div class="lb-item">
      <span class="lb-rank ${i < 3 ? rankClasses[i] : ''}">${i < 3 ? medals[i] : i + 1}</span>
      <div class="lb-info">
        <div class="lb-time">${r.time} 秒</div>
        <div class="lb-date">${r.date}</div>
      </div>
      ${i === 0 ? '<span class="lb-medal">👑</span>' : ''}
    </div>
  `).join('');
}

function clearLb() {
  if (!confirm('确定清空当前难度的所有记录？')) return;
  const lb = getLeaderboard();
  lb[currentLbTab] = [];
  saveLeaderboard(lb);
  renderLbList();
}

// 点击外部关闭排行榜
document.getElementById('lbOverlay').addEventListener('click', e => {
  if (e.target.classList.contains('lb-overlay')) toggleLeaderboard();
});
